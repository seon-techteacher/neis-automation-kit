
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>출결 달력 — 출결판 미리보기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic', sans-serif;
  font-size: 13px;
  background: #f4f6f8;
  color: #222;
  width: 100%;
  height: 100%;
}
.layout {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 680px;
  overflow: hidden;
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #1a5276;
  color: #fff;
  flex-shrink: 0;
  height: 46px;
}
.top-bar .title { font-size: 14px; font-weight: bold; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button {
  border: 1px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 4px;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 13px;
}
.month-nav button:hover { background: rgba(255,255,255,0.3); }
.month-nav .cur-label { font-size: 14px; font-weight: bold; min-width: 80px; text-align: center; }
.content {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
.left-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px;
  overflow: hidden;
  min-width: 0;
}
.legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #444; }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.loading-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #888;
}
.error-msg { color: #c0392b; }
.cal-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  flex: 1;
  border: 1px solid #c8cdd2;
  border-radius: 6px;
  overflow: hidden;
  min-height: 0;
}
.day-header {
  text-align: center;
  font-size: 11px; font-weight: bold;
  padding: 5px 0;
  background: #1a5276; color: #fff;
  border-right: 1px solid #2471a3;
}
.day-header:last-child { border-right: none; }
.day-header.sun { background: #a93226; }
.day-header.sat { background: #1a6ba0; }
.day-cell {
  min-height: 0;
  padding: 4px 3px;
  border-right: 1px solid #dde1e5;
  border-bottom: 1px solid #dde1e5;
  cursor: pointer;
  background: #fff;
  transition: background 0.1s;
  overflow: hidden;
}
.day-cell:hover { background: #eaf4fb; }
.day-cell.empty    { background: #f8f9fa; cursor: default; }
.day-cell.off      { background: #f5f5f5; }
.day-cell.weekend  { background: #fafafa; }
.day-cell.selected { background: #d4e6f1 !important; outline: 2px solid #2471a3; outline-offset: -2px; }
.day-num {
  font-size: 11px; font-weight: bold;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  margin-bottom: 2px;
  color: #333;
}
.day-cell.sun .day-num { color: #a93226; }
.day-cell.sat .day-num { color: #1a6ba0; }
.day-cell.today .day-num { background: #1d8348; color: #fff; }
.off-name {
  font-size: 10px;
  color: #888;
  padding: 1px 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.day-top { display: flex; align-items: center; gap: 3px; margin-bottom: 2px; }
.day-top .day-num { margin-bottom: 0; flex-shrink: 0; }
.club-tag { font-size: 10px; font-weight: bold; color: #1a73e8; white-space: nowrap; }
.ev-tag {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2px;
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
  margin-bottom: 1px;
  line-height: 1.4;
  overflow: hidden;
}
.ev-tag .ev-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.ev-tag .ev-days {
  flex-shrink: 0;
  font-size: 9px;
  font-weight: bold;
  background: rgba(255,255,255,0.65);
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 6px;
  padding: 0 4px;
  line-height: 1.5;
  color: #2e7d32;
}
.ev-tag.t-cert-abs   { background: #fdebd0; color: #784212; }
.ev-tag.t-sick-abs   { background: #fce4e4; color: #922b21; }
.ev-tag.t-sick-late  { background: #fef9e7; color: #7d6608; }
.ev-tag.t-sick-leave { background: #d6eaf8; color: #1a5276; }
.ev-tag.t-unauth     { background: #e8daef; color: #5b2c6f; }
.ev-more { font-size: 10px; color: #888; padding-left: 2px; }
.right-panel {
  width: 280px;
  flex-shrink: 0;
  border-left: 1px solid #dde1e5;
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.detail-header {
  background: #1a5276;
  color: #fff;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
}
.detail-sub { font-size: 11px; font-weight: normal; opacity: 0.8; margin-top: 2px; }
.detail-body { flex: 1; overflow-y: auto; padding: 10px 12px; }
.placeholder { text-align: center; color: #aaa; font-size: 12px; margin-top: 30px; line-height: 2; }
.cat-block { margin-bottom: 12px; }
.cat-block:last-child { margin-bottom: 0; }
.cat-label {
  display: inline-block;
  font-size: 11px; font-weight: bold;
  padding: 2px 8px; border-radius: 10px; margin-bottom: 5px;
}
.cat-label.t-cert-abs   { background: #fdebd0; color: #784212; }
.cat-label.t-sick-abs   { background: #fce4e4; color: #922b21; }
.cat-label.t-sick-late  { background: #fef9e7; color: #7d6608; }
.cat-label.t-sick-leave { background: #d6eaf8; color: #1a5276; }
.cat-label.t-unauth     { background: #e8daef; color: #5b2c6f; }
.student-row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 12px;
}
.student-row:last-child { border-bottom: none; }
.s-no     { color: #999; min-width: 30px; font-size: 11px; text-align: right; }
.s-name   { font-weight: bold; min-width: 52px; }
.s-detail { color: #666; font-size: 11px; }
.s-badge  { margin-left: auto; font-size: 10px; padding: 2px 5px; border-radius: 8px; white-space: nowrap; }
.s-badge.doc       { background: #e8f8f5; color: #1e8449; }
.s-badge.period    { background: #f0f0f0; color: #555; }
.s-badge.trip-days { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; font-weight: bold; }
/* ── 출석부 기입 기호 ── */
.mk { vertical-align: middle; }
.mark-chip {
  display: inline-flex; align-items: center; gap: 5px;
  margin-left: 8px; padding: 2px 8px 2px 4px;
  background: #fff; border: 1px solid #dfe4e8; border-radius: 12px;
  font-size: 11px; color: #555; vertical-align: middle;
}
.mark-chip .mk-txt { font-weight: bold; color: #333; }
.s-mark { display: inline-flex; align-items: center; margin-left: 2px; }
.guide-btn {
  width: 100%; padding: 7px; margin-top: 6px;
  background: #fff; color: #1a5276;
  border: 1px solid #1a5276; border-radius: 5px;
  font-size: 12px; cursor: pointer;
}
.guide-btn:hover { background: #eaf2f8; }
.mg-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 999;
  align-items: center; justify-content: center;
}
.mg-overlay.on { display: flex; }
.mg-box {
  background: #fff; border-radius: 10px; padding: 16px 18px;
  box-shadow: 0 8px 28px rgba(0,0,0,.28); max-width: 460px;
}
.mg-head {
  font-size: 14px; font-weight: bold; color: #1a5276;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.mg-x { cursor: pointer; color: #999; font-size: 15px; padding: 0 4px; }
.mg-x:hover { color: #444; }
.mg-table { border-collapse: collapse; width: 100%; }
.mg-table th, .mg-table td {
  border: 1px solid #d7dde2; text-align: center;
  padding: 5px 6px; font-size: 12px;
}
.mg-table th { background: #f2f5f7; color: #445; font-weight: bold; }
.mg-table th.rowh { background: #f7f9e8; color: #4a5b18; }
.mg-note { margin-top: 10px; font-size: 11px; color: #777; line-height: 1.7; }
.off-day-notice {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 20px;
  line-height: 2;
  padding: 16px 8px;
  background: #f8f8f8;
  border-radius: 8px;
}
.off-day-notice .off-icon  { font-size: 24px; display: block; margin-bottom: 4px; }
.off-day-notice .off-title { font-weight: bold; font-size: 14px; color: #444; }
.bottom-bar {
  padding: 8px 12px;
  border-top: 1px solid #dde1e5;
  flex-shrink: 0;
}
.refresh-btn {
  width: 100%; padding: 7px;
  background: #1a5276; color: #fff;
  border: none; border-radius: 5px;
  font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.refresh-btn:hover { background: #154360; }
.refresh-btn:disabled { background: #aaa; cursor: default; }
/* ── 출결판: 나이스 상태 겹쳐 보기 ── */
.ev-tag.st-already { opacity: .42; }
.ev-tag.st-check   { box-shadow: inset 0 0 0 2px #1a73e8; }
.ev-tag.st-bad     { box-shadow: inset 0 0 0 2px #d4ac0d; }
.st-legend { display:flex; flex-wrap:wrap; gap:10px; padding:0 12px 6px; font-size:11px; color:#555; }
.st-legend span b { display:inline-block; width:22px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:3px; background:#f5cba7; border:1px solid #e0a96d; }
.s-status { font-size: 11px; padding: 0 0 7px 38px; color: #555; }
.s-status.st-ok      { color: #15803d; font-weight: bold; }
.s-status.st-already { color: #888; }
.s-status.st-check   { color: #1a5fb4; }
.s-status.st-bad     { color: #9a6b00; }
.s-status.st-holiday { color: #888; }
.school-note { margin: 0 12px 6px; font-size: 11px; color: #8a6d3b; background: #fff8e1; border-radius: 6px; padding: 5px 8px; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="title">📅 출결 달력 뷰</div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀</button>
      <span class="cur-label" id="cur-label">로딩중...</span>

    <div class="left-panel">
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:#e67e22"></div>출석인정결석</div>
        <div class="leg"><div class="leg-dot" style="background:#c0392b"></div>질병결석</div>
        <div class="leg"><div class="leg-dot" style="background:#d4ac0d"></div>지각</div>
        <div class="leg"><div class="leg-dot" style="background:#2980b9"></div>조퇴</div>

        <div class="placeholder">달력에서 날짜를 클릭하면<br>해당 날의 출결 현황이<br>여기에 표시됩니다.</div>
      </div>

        <button class="refresh-btn" id="refresh-btn" style="display:none" onclick="loadData()">🔄 출결 데이터 새로고침</button>
        <button class="guide-btn" onclick="openGuide()">📖 출석부 기입 기호표 보기</button>

</div>

<div class="mg-overlay" id="mg-overlay" onclick="closeGuide()">
  <div class="mg-box" onclick="event.stopPropagation()">
    <div class="mg-head">
      <span>📖 출석부(본사) 기입 기호</span>
      <span class="mg-x" onclick="closeGuide()">&#10005;</span>
    </div>
    <table class="mg-table" id="mg-table"></table>
    <div class="mg-note">
      · 지각은 사선 하나(&#8599; 방향), 조퇴는 &#10005;, 결석과 결과는 도형만 그립니다.
    </div>
  </div>
</div>

<script>
window.__DATA__ = /*__DATA__*/null;
try { if (window.outerWidth < 1200) { window.resizeTo(Math.min(screen.availWidth, 1360), Math.min(screen.availHeight, 920)); window.moveTo(Math.max(0, (screen.availWidth - Math.min(screen.availWidth, 1360)) / 2), 0); } } catch (e) {}   // 크롬이 이미 켜져 있으면 --window-size 를 안 들어서
window.google = {script: {run: (function () { var h = {}; var o = {
  withSuccessHandler: function (f) { h.s = f; return o; }, withFailureHandler: function (f) { h.f = f; return o; },
  getAttendanceByDate: function () { setTimeout(function () { h.s(window.__DATA__ || {error: '자료가 없어요'}); }, 0); } };
  return o; })()}};
var STATUS_TEXT = {ok: '넣을 것', already: '이미 나이스에 있음'};
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var CAT_CLASS = {
  '출석인정결석': 't-cert-abs', '인정결석': 't-cert-abs',
  '질병결석': 't-sick-abs',     '미인정결석': 't-unauth',
  '질병지각': 't-sick-late',    '미인정지각': 't-unauth',
  '질병조퇴': 't-sick-leave',   '출석인정조퇴': 't-sick-leave', '미인정조퇴': 't-unauth', '출석인정지각': 't-sick-late'
};
var DOC_NEEDED = ['출석인정결석','인정결석','질병결석','출석인정조퇴'];
var CAT_ORDER  = ['출석인정결석','인정결석','질병결석','미인정결석','출석인정지각','질병지각','미인정지각','질병조퇴','출석인정조퇴','미인정조퇴'];

// ─────────────────────────────────────────────
// 출석부(본사) 기입 기호 — 출석부 뒷면 범례표 그대로
// ─────────────────────────────────────────────
var MARK_BASE = {
  '질병':   { shape: 'circle',   color: '#222',    name: '동그라미' },
  '미인정': { shape: 'dcircle',  color: '#222',    name: '겹동그라미' },
  '기타':   { shape: 'square',   color: '#222',    name: '네모' },
  '인정':   { shape: 'triangle', color: '#c0392b', name: '세모' }
};
var MARK_OVER = {
  '결석': { over: 'none',  name: '' },
  '결과': { over: 'none',  name: '' },
  '지각': { over: 'slash', name: '에 사선' },
  '조퇴': { over: 'cross', name: '에 ✕' }
};
var GUBUN_ORDER = ['질병', '미인정', '기타', '인정'];
var JONG_ORDER  = ['결석', '지각', '조퇴', '결과'];

/** 시트의 분류값('질병조퇴' 등) → { gubun, jong } */
function parseCat(cat) {
  var c = String(cat || '').replace(/\s/g, '');
  var g = null;
  if      (c.indexOf('미인정')   === 0) g = '미인정';
  else if (c.indexOf('질병')     === 0) g = '질병';
  else if (c.indexOf('기타')     === 0) g = '기타';
  else if (c.indexOf('출석인정') === 0 || c.indexOf('인정') === 0) g = '인정';

  var j = null;
  JONG_ORDER.forEach(function(k) { if (c.indexOf(k) >= 0) j = k; });

  if (!g || !j) return null;
  return { gubun: g, jong: j };
}

/** 기호 SVG 문자열 */
function markSVG(gubun, jong, size) {
  var base = MARK_BASE[gubun], ov = MARK_OVER[jong];
  if (!base || !ov) return '';
  size = size || 22;

  var s = '<svg class="mk" width="' + size + '" height="' + size + '" viewBox="0 0 24 24"'
        + ' fill="none" stroke="' + base.color + '" stroke-width="1.7" stroke-linecap="round">';

  if (base.shape === 'circle')   s += '<circle cx="12" cy="12" r="8.5"/>';
  if (base.shape === 'dcircle')  s += '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/>';
  if (base.shape === 'square')   s += '<rect x="3.6" y="3.6" width="16.8" height="16.8"/>';
  if (base.shape === 'triangle') s += '<path d="M12 3.4 L20.8 20.2 L3.2 20.2 Z" stroke-linejoin="round"/>';

  if (ov.over === 'slash') s += '<line x1="3.6" y1="20.4" x2="20.4" y2="3.6"/>';
  if (ov.over === 'cross') s += '<line x1="3.6" y1="20.4" x2="20.4" y2="3.6"/>'
                             +  '<line x1="3.6" y1="3.6" x2="20.4" y2="20.4"/>';
  return s + '</svg>';
}

/** 분류 → '출석부: ○ 동그라미' 칩 HTML */
function markChip(cat) {
  var m = parseCat(cat);
  if (!m) return '';
  var base = MARK_BASE[m.gubun], ov = MARK_OVER[m.jong];
  return '<span class="mark-chip" title="출석부에 이렇게 기입">'
       + markSVG(m.gubun, m.jong, 20)
       + '<span class="mk-txt">' + base.name + ov.name + '</span></span>';
}

/** 기호표 모달 */
function buildGuideTable() {
  var t = document.getElementById('mg-table');
  if (!t || t.dataset.built) return;

  var html = '<tr><th>구분</th>';
  JONG_ORDER.forEach(function(j) { html += '<th>' + j + '</th>'; });
  html += '</tr>';

  GUBUN_ORDER.forEach(function(g) {
    html += '<tr><th class="rowh">' + g + '</th>';
    JONG_ORDER.forEach(function(j) { html += '<td>' + markSVG(g, j, 26) + '</td>'; });
    html += '</tr>';
  });

  t.innerHTML = html;
  t.dataset.built = '1';
}

function openGuide()  { buildGuideTable(); document.getElementById('mg-overlay').classList.add('on'); }
function closeGuide() { document.getElementById('mg-overlay').classList.remove('on'); }

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeGuide(); });

var curMonth     = new Date().getMonth() + 1;

function loadData() {
  var loadEl = document.getElementById('loading-area');
  var calEl  = document.getElementById('cal-grid');
  var btn    = document.getElementById('refresh-btn');
  loadEl.style.display = 'flex';
  loadEl.className     = 'loading-area';
  loadEl.textContent   = '⏳ 출결 데이터 불러오는 중...';
  calEl.style.display  = 'none';
  btn.disabled = true;
  selectedDay  = null;
  document.getElementById('detail-title').textContent = '날짜를 선택하세요';
  document.getElementById('detail-sub').textContent   = '';
  document.getElementById('detail-body').innerHTML    =
    '<div class="placeholder">달력에서 날짜를 클릭하면<br>해당 날의 출결 현황이<br>여기에 표시됩니다.</div>';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (!result || result.error) {
        loadEl.textContent = '❌ ' + (result ? result.error : '오류 발생');
        loadEl.className   = 'loading-area error-msg';
        return;
      }
      allRows  = result.rows || [];
      curYear  = result.year || new Date().getFullYear();
      curMonth = result.month || (new Date().getMonth() + 1);
      document.getElementById('school-note').style.display = result.school ? 'none' : 'block';

      schoolOffMap = {};
      (result.schoolOffDays || []).forEach(function(item) {
        schoolOffMap[item.key] = item.label || '';
      });

      clubMap = {};
      (result.clubDays || []).forEach(function(item) {
        clubMap[item.key] = item.title || '동아리';
      });

      loadEl.style.display = 'none';
      calEl.style.display  = 'grid';
      renderCalendar();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      loadEl.textContent = '❌ 오류: ' + (err ? err.message : '알 수 없는 오류');
      loadEl.className   = 'loading-area error-msg';
    })
    .getAttendanceByDate();
}

function changeMonth(delta) {
  curMonth += delta;
  if (curMonth > 12) { curMonth = 1; curYear++; }
  if (curMonth < 1)  { curMonth = 12; curYear--; }
  selectedDay = null;
  renderCalendar();
}

function buildDayMap(year, month) {
  var map = {};
  allRows.forEach(function(r) {
    if (r.month !== month) return;
    if (!map[r.day]) map[r.day] = [];
    map[r.day].push(r);
  });
  // 날짜마다 학생 번호 오름차순
  Object.keys(map).forEach(function(d) {
    map[d].sort(function(a, b) { return (parseInt(a.no, 10) || 999) - (parseInt(b.no, 10) || 999); });
  });
  return map;
}

/** 학사일정(K열) 결석일 여부 확인 */
function getOffLabel(month, day) {
  var key = month + '/' + day;
  return (key in schoolOffMap) ? schoolOffMap[key] : null;
}

/** 요일 인덱스(0=일, 6=토)로 주말 여부 확인 */
function isWeekendDow(dow) {
  return dow === 0 || dow === 6;
}

/** ev-tag 엘리먼트 생성 */
function makeEvTag(ev) {
  var tag = document.createElement('div');
  tag.className = 'ev-tag ' + (CAT_CLASS[ev.category] || 't-cert-abs') + ' st-' + (ev.status || 'ok');

  var nameSpan = document.createElement('span');
  nameSpan.className   = 'ev-name';
  nameSpan.textContent = ev.name;
  tag.appendChild(nameSpan);

  // 출석인정결석 + dateStr 시작일 일치 시 일수 표시
  if (ev.category === '출석인정결석' && ev.effectiveDays && ev.effectiveDays !== '') {
    var startMatch = ev.dateStr.match(/^(\d+)\/(\d+)/);
    if (startMatch) {
      var sm = parseInt(startMatch[1]), sd = parseInt(startMatch[2]);
      if (sm === ev.month && sd === ev.day) {
        var daysSpan = document.createElement('span');
        daysSpan.className   = 'ev-days';
        daysSpan.textContent = ev.effectiveDays;
        tag.appendChild(daysSpan);
      }
    }
  }
  return tag;
}

function renderCalendar() {
  document.getElementById('cur-label').textContent = curYear + '년 ' + curMonth + '월';
  var grid     = document.getElementById('cal-grid');
  var dayMap   = buildDayMap(curYear, curMonth);
  var today    = new Date();
  var firstDow = new Date(curYear, curMonth - 1, 1).getDay();
  var lastDay  = new Date(curYear, curMonth, 0).getDate();

  if (!grid.querySelector('.day-header')) {
    ['일','월','화','수','목','금','토'].forEach(function(d, i) {
      var h = document.createElement('div');
      h.className = 'day-header' + (i===0?' sun':i===6?' sat':'');
      h.textContent = d;
      grid.appendChild(h);
    });
  }
  Array.from(grid.querySelectorAll('.day-cell')).forEach(function(c){ c.remove(); });

  for (var i = 0; i < firstDow; i++) {
    var e = document.createElement('div');
    e.className = 'day-cell empty';
    grid.appendChild(e);
  }

  for (var day = 1; day <= lastDay; day++) {
    var dow      = (firstDow + day - 1) % 7;
    var offLabel = getOffLabel(curMonth, day); // null이면 수업일
    var isOff    = offLabel !== null;
    var isWknd   = isWeekendDow(dow); // 토·일 여부

    var cell = document.createElement('div');
    var cls  = 'day-cell' + (dow===0?' sun':dow===6?' sat':'');
    if (isOff)   cls += ' off';
    if (isWknd && !isOff) cls += ' weekend';
    if (today.getFullYear()===curYear && today.getMonth()+1===curMonth && today.getDate()===day) cls += ' today';
    if (selectedDay===day) cls += ' selected';
    cell.className = cls;

    var top = document.createElement('div');
    top.className = 'day-top';
    var num = document.createElement('div');
    num.className   = 'day-num';
    num.textContent = day;
    top.appendChild(num);

    // 동아리 날(7교시): 날짜 오른쪽에 파란 글씨
    var clubTitle = (!isOff && !isWknd) ? clubMap[curMonth + '/' + day] : null;
    if (clubTitle) {
      var club = document.createElement('span');
      club.className   = 'club-tag';
      club.textContent = '동아리';
      club.title       = clubTitle + ' (7교시)';
      top.appendChild(club);
    }
    cell.appendChild(top);

    if (isOff) {
      // 학사일정: 이름만 표시
      if (offLabel !== '') {
        var offNameEl = document.createElement('div');
        offNameEl.className   = 'off-name';
        offNameEl.textContent = offLabel;
        cell.appendChild(offNameEl);
      }
    } else if (!isWknd) {
      // 평일 수업일: 학생 출결 태그 표시
      var events = dayMap[day] || [];
      events.slice(0, 3).forEach(function(ev) {
        cell.appendChild(makeEvTag(ev));
      });
      if (events.length > 3) {
        var more = document.createElement('div');
        more.className   = 'ev-more';
        more.textContent = '+' + (events.length - 3) + '명';
        cell.appendChild(more);
      }
    }
    // 토·일은 숫자만 표시 (학생 태그 없음)

    (function(d, off, label, wknd) {
      cell.onclick = function() { selectDay(d, off, label, wknd); };
    })(day, isOff, offLabel, isWknd);

    grid.appendChild(cell);
  }
}

function selectDay(day, isOff, offLabel, isWknd) {
  selectedDay = day;
  renderCalendar();

  document.getElementById('detail-title').textContent = curMonth + '월 ' + day + '일';
  var body = document.getElementById('detail-body');

  // 학사일정 결석일
  if (isOff) {
    var label = offLabel && offLabel !== '' ? offLabel : '학사일정';
    document.getElementById('detail-sub').textContent = label;
    body.innerHTML =
      '<div class="off-day-notice">'
      + '<span class="off-icon">📅</span>'
      + '<span class="off-title">' + label + '</span>'
      + '<br>출결이 적용되지 않는 날입니다.'
      + ((buildDayMap(curYear, curMonth)[day] || []).length ? '<br>이 날 캘린더 일정 ' + buildDayMap(curYear, curMonth)[day].length + '건은 나이스에 넣지 않아요.' : '')
      + '</div>';
    return;
  }

  // 토·일
  if (isWknd) {
    document.getElementById('detail-sub').textContent = '주말';
    body.innerHTML =
      '<div class="off-day-notice">'
      + '<span class="off-icon">🏖️</span>'
      + '<span class="off-title">주말</span>'
      + '<br>출결이 적용되지 않는 날입니다.'
      + '</div>';
    return;
  }

  // 평일 수업일
  var dayMap = buildDayMap(curYear, curMonth);
  var events = dayMap[day] || [];
  var clubT  = clubMap[curMonth + '/' + day];
  document.getElementById('detail-sub').textContent =
    (clubT ? '🔵 동아리 · 7교시 / ' : '') + '총 ' + events.length + '명';

  if (events.length === 0) {
    body.innerHTML = '<div class="placeholder" style="color:#bbb">이 날 출결 기록이 없습니다.</div>';
    return;
  }

  var groups = {};
  events.forEach(function(ev) {
    if (!groups[ev.category]) groups[ev.category] = [];
    groups[ev.category].push(ev);
  });

  var sorted = Object.keys(groups).sort(function(a, b) {
    return (CAT_ORDER.indexOf(a)===-1?99:CAT_ORDER.indexOf(a)) -
           (CAT_ORDER.indexOf(b)===-1?99:CAT_ORDER.indexOf(b));
  });

  body.innerHTML = sorted.map(function(cat) {
    var cls  = CAT_CLASS[cat] || 't-cert-abs';
    var rows = groups[cat].map(function(s) {
      var isDoc     = DOC_NEEDED.includes(s.category);
      var hasPeriod = s.detail && s.detail.trim() !== '';
      var hasDays   = s.effectiveDays && s.effectiveDays !== '' && s.category === '출석인정결석';

      var badge = '';
      if (hasDays) {
        badge = '<span class="s-badge trip-days">🎒 ' + s.effectiveDays + '</span>';
      } else if (isDoc) {
        badge = '<span class="s-badge doc">서류필요</span>';
      } else if (hasPeriod) {
        badge = '<span class="s-badge period">' + esc(s.detail) + '</span>';
      }

      var detail = (hasPeriod && isDoc && !hasDays)
        ? '<span class="s-detail">' + esc(s.detail) + '</span>' : '';

      var m    = parseCat(s.category);
      var mark = m ? '<span class="s-mark" title="출석부 기입 기호">'
                     + markSVG(m.gubun, m.jong, 17) + '</span>' : '';

      return '<div class="student-row">'
        + '<span class="s-no">' + s.no + '번</span>'
        + '<span class="s-name">' + esc(s.name) + '</span>'
        + mark
        + detail + badge
        + '</div>'
        + '<div class="s-status st-' + (s.status || 'ok') + '">' + esc(STATUS_TEXT[s.status] || s.why || '') + '</div>';
    }).join('');

    return '<div class="cat-block">'
      + '<span class="cat-label ' + cls + '">' + cat + ' ' + groups[cat].length + '명</span>'
      + markChip(cat)
      + rows + '</div>';
  }).join('');
}

loadData();
</script>
</body>
