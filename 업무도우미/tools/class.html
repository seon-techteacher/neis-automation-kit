<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학급 도구 · 업무도우미</title>
<meta name="author" content="Kang SeongHo">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../common.css">
<style>
.win { --c: var(--c-class); }
.roster { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--sunk); }
.roster summary { cursor: pointer; font-weight: 700; }
.roster textarea { width: 100%; min-height: 140px; margin-top: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.opts label { display: inline-flex; align-items: center; gap: 6px; }
.opts input[type=number] { width: 5em; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.group { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.group b { display: block; color: var(--c); margin-bottom: 4px; }
.group li { list-style: none; }
.group ul { margin: 0; padding: 0; }
.picked { min-height: 130px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.picked span { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; padding: 4px 18px; border-radius: 12px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.card { max-width: 420px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.card img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 12px; background: var(--sunk); }
.card .nm { font-size: 1.8rem; font-weight: 800; min-height: 1.4em; }
#qrBox { padding: 16px; background: #fff; border-radius: 12px; border: 1px solid var(--line); display: inline-block; }
#qrBox img, #qrBox canvas { display: block; }
#print { display: none; }
@media print {
  body > .win { display: none !important; }
  #print { display: block; color: #000; background: #fff; font-family: "Malgun Gothic", sans-serif; }
  .labels { display: grid; gap: 0; }
  .label { border: 1px dashed #999; display: grid; place-items: center; font-weight: 800; text-align: center; padding: 4mm; break-inside: avoid; }
  .ptable { width: 100%; border-collapse: collapse; }
  .ptable th, .ptable td { border: 1px solid #000; padding: 2.2mm 3mm; font-size: 11pt; background: #fff; color: #000; position: static; }
  .ptable th { background: #eee; }
  .ptitle { font-size: 15pt; font-weight: 800; margin: 0 0 4mm; }
  @page { size: A4; margin: 12mm; }
}
</style>
<script src="../lib/qrcode.min.js"></script>
<script src="../common.js"></script>
</head>
<body>
<div class="win">
  <header class="w-head">
    <h1>학급 도구</h1>
    <nav class="w-tabs" id="tabs">
      <button data-tab="group" class="on">모둠 편성</button><button data-tab="pick">뽑기</button><button data-tab="turn">순번표</button>
      <button data-tab="meet">상담 시간</button><button data-tab="print">출력물</button><button data-tab="face">이름 외우기</button><button data-tab="qr">QR 만들기</button>
    </nav>
    <span class="local">명단은 이 창을 닫으면 사라져요</span>
  </header>

  <div class="w-body" style="padding-bottom:0" id="rosterWrap">
    <details class="roster" open>
      <summary>명단 <span class="muted" id="rCount"></span></summary>
      <textarea id="roster" spellcheck="false" placeholder="한 줄에 한 명씩 붙여 넣으세요. 번호와 이름이 같이 있어도 돼요.&#10;1	김가을&#10;2	박나래"></textarea>
    </details>
  </div>

  <section class="w-body" data-pane="group">
    <div class="opts">
      <label><input type="radio" name="gMode" value="count" checked> 모둠 수 <input type="number" id="gCount" value="6" min="1"></label>
      <label><input type="radio" name="gMode" value="size"> 모둠당 인원 <input type="number" id="gSize" value="4" min="1"></label>
      <button class="btn primary big" id="gGo">모둠 짜기</button><button class="btn big" id="gCopy">복사</button>
    </div>
    <div class="groups" id="gOut"></div>
  </section>

  <section class="w-body" data-pane="pick" hidden>
    <div class="opts">
      <label><input type="number" id="pN" value="1" min="1"> 명 뽑기</label>
      <label><input type="checkbox" id="pOnce" checked> 뽑힌 사람은 다음에 빼기</label>
      <button class="btn primary big" id="pGo">뽑기</button><button class="btn big" id="pReset">처음부터</button>
      <span class="muted" id="pLeft"></span>
    </div>
    <div class="picked" id="pOut"><span class="muted" style="font-size:1rem;background:none">뽑기를 눌러 주세요</span></div>
  </section>

  <section class="w-body" data-pane="turn" hidden>
    <h2>당번표</h2>
    <div class="opts">
      <label>시작일 <input type="date" id="tStart"></label>
      <label>하루 <input type="number" id="tPer" value="2" min="1"> 명</label>
      <label><input type="checkbox" id="tWeek" checked> 주말 빼기</label>
      <label><input type="checkbox" id="tShuffle"> 순서 섞기</label>
      <button class="btn primary big" id="tGo">당번표 만들기</button>
    </div>
    <h2>1인 1역</h2>
    <div class="cols">
      <label class="field"><span>역할 (한 줄에 하나)</span><textarea id="tRoles" style="min-height:120px" placeholder="칠판&#10;우유&#10;분리수거&#10;창문"></textarea></label>
      <div class="field"><span>&nbsp;</span><div class="opts"><label><input type="checkbox" id="rShuffle" checked> 학생 순서 섞기</label><button class="btn primary big" id="rGo">역할 나누기</button></div>
        <p class="muted small">학생이 역할보다 많으면 역할을 처음부터 다시 돌려요.</p></div>
    </div>
    <div class="row"><button class="btn" id="tCopy">표 복사 (엑셀에 붙여 넣기)</button></div>
    <div class="tbl-wrap" id="tWrap" hidden><table id="tTbl"></table></div>
  </section>

  <section class="w-body" data-pane="meet" hidden>
    <div class="opts">
      <label>첫날 <input type="date" id="mStart"></label>
      <label>시작 <input id="mFrom" value="15:30" style="width:5em"></label>
      <label>끝 <input id="mTo" value="17:30" style="width:5em"></label>
      <label>한 명 <input type="number" id="mLen" value="20" min="5"> 분</label>
      <label>사이 <input type="number" id="mGap" value="0" min="0"> 분</label>
      <label><input type="checkbox" id="mWeek" checked> 주말 빼기</label>
      <label><input type="checkbox" id="mShuffle"> 순서 섞기</label>
      <button class="btn primary big" id="mGo">시간 배정</button><button class="btn big" id="mCopy">표 복사</button>
    </div>
    <div class="status muted" id="mInfo"></div>
    <div class="tbl-wrap" id="mWrap" hidden><table id="mTbl"></table></div>
  </section>

  <section class="w-body" data-pane="print" hidden>
    <h2>이름표</h2>
    <div class="opts">
      <label>한 줄에 <select id="lCols"><option>2</option><option selected>3</option><option>4</option><option>5</option></select> 칸</label>
      <label>칸 높이 <select id="lH"><option value="30">낮게</option><option value="45" selected>보통</option><option value="65">높게</option></select></label>
      <label>글씨 <select id="lFont"><option value="16">작게</option><option value="24" selected>보통</option><option value="36">크게</option></select></label>
      <button class="btn primary big" id="lGo">이름표 인쇄</button>
    </div>
    <h2>체크표</h2>
    <div class="opts">
      <label>제목 <input id="cTitle" placeholder="예: 2학년 1반 제출 확인" style="width:16em"></label>
      <label>칸 제목 <input id="cHeads" placeholder="쉼표로 구분 (예: 동의서, 사진, 회비)" style="width:20em"></label>
      <button class="btn primary big" id="cGo">체크표 인쇄</button>
    </div>
    <p class="muted small">인쇄 창에서 ‘PDF로 저장’을 고르면 파일로도 남길 수 있어요.</p>
  </section>

  <section class="w-body" data-pane="face" hidden>
    <div class="drop" id="fDrop"><b>학생 사진을 넣으세요</b>파일 이름이 학생 이름이어야 해요 (예: 김가을.jpg). 사진은 저장하지 않고 창을 닫으면 사라져요.<input type="file" id="fFile" multiple accept="image/*" hidden></div>
    <div class="card" id="fCard" hidden>
      <div class="muted num" id="fProg"></div>
      <img id="fImg" alt="학생 사진">
      <div class="nm" id="fName"></div>
      <div class="row"><button class="btn big" id="fShow">이름 보기</button><button class="btn primary big" id="fOk">알아요</button><button class="btn big" id="fNo">다시 볼래요</button></div>
    </div>
  </section>

  <section class="w-body" data-pane="qr" hidden>
    <label class="field"><span>주소나 글</span><input id="qText" placeholder="https://… (설문 주소 등)"></label>
    <div class="opts"><label>크기 <select id="qSize"><option value="200">작게</option><option value="320" selected>보통</option><option value="512">크게</option></select></label>
      <button class="btn primary big" id="qGo">QR 만들기</button><button class="btn big" id="qSave" disabled>그림으로 저장</button></div>
    <div><div id="qrBox" hidden></div></div>
    <p class="muted small">QR은 이 PC에서 만들어요. 주소를 다른 곳으로 보내지 않아요.</p>
  </section>
</div>
<div id="print"></div>

<script>
'use strict';
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayLabel = d => `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})`;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const names = () => parseTable($('roster').value).map(r => r.filter(Boolean).join(' '));
const need = () => { const n = names(); if (!n.length) { toast('먼저 위에 명단을 넣어 주세요.'); $('roster').focus(); } return n; };
const nextDay = (d, skipWeekend) => { do d.setDate(d.getDate() + 1); while (skipWeekend && d.getDay() % 6 === 0); };
const firstDay = (v, skipWeekend) => { const d = new Date((v || iso(new Date())) + 'T00:00'); while (skipWeekend && d.getDay() % 6 === 0) d.setDate(d.getDate() + 1); return d; };
function showTable(wrap, tbl, head, rows) { wrap.hidden = false; tbl.innerHTML = '<tr>' + head.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join(''); }
const tsv = (head, rows) => [head, ...rows].map(r => r.join('\t')).join('\n');

// 명단은 탭을 옮겨도 남고, 새로고침해도 이 창이 열려 있는 동안만 남는다.
try { $('roster').value = sessionStorage.getItem('udesk.roster') || ''; } catch { /* 없어도 됨 */ }
const onRoster = () => { $('rCount').textContent = names().length ? `${names().length}명` : '(비어 있음)'; try { sessionStorage.setItem('udesk.roster', $('roster').value); } catch { /* 없어도 됨 */ } };
$('roster').addEventListener('input', onRoster); onRoster();
tabs($('tabs'), t => { $('rosterWrap').hidden = t === 'face' || t === 'qr'; });
$('tStart').value = $('mStart').value = iso(new Date());

// ── 모둠 ──
let gGroups = [];
$('gGo').addEventListener('click', () => {
  const n = need(); if (!n.length) return;
  const byCount = document.querySelector('[name=gMode]:checked').value === 'count';
  const k = Math.max(1, Math.min(n.length, byCount ? +$('gCount').value || 1 : Math.ceil(n.length / (+$('gSize').value || 1))));
  gGroups = Array.from({ length: k }, () => []);
  shuffle(n).forEach((s, i) => gGroups[i % k].push(s));
  $('gOut').innerHTML = gGroups.map((g, i) => `<div class="group"><b>${i + 1}모둠 · ${g.length}명</b><ul>${g.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`).join('');
});
$('gCopy').addEventListener('click', () => gGroups.length ? copyText(gGroups.map((g, i) => `${i + 1}모둠\t${g.join('\t')}`).join('\n')) : toast('먼저 모둠을 짜 주세요.'));

// ── 뽑기 ──
let pool = null;
$('pReset').addEventListener('click', () => { pool = null; $('pLeft').textContent = ''; $('pOut').innerHTML = '<span class="muted" style="font-size:1rem;background:none">뽑기를 눌러 주세요</span>'; });
$('roster').addEventListener('input', () => { pool = null; });
$('pGo').addEventListener('click', () => {
  const n = need(); if (!n.length) return;
  if (!pool || !pool.length) pool = [...n];
  const k = Math.min(+$('pN').value || 1, pool.length), got = shuffle(pool).slice(0, k);
  if ($('pOnce').checked) { pool = pool.filter(s => !got.includes(s)); $('pLeft').textContent = pool.length ? `남은 사람 ${pool.length}명` : '모두 뽑았어요. 다음에는 처음부터 다시 뽑아요.'; }
  else $('pLeft').textContent = '';
  $('pOut').innerHTML = got.map(s => `<span>${esc(s)}</span>`).join('');
});

// ── 순번표 ──
let tLast = null;
$('tGo').addEventListener('click', () => {
  let n = need(); if (!n.length) return;
  if ($('tShuffle').checked) n = shuffle(n);
  const per = Math.max(1, +$('tPer').value || 1), wk = $('tWeek').checked, d = firstDay($('tStart').value, wk), rows = [];
  for (let i = 0; i < n.length; i += per) { rows.push([dayLabel(d), ...n.slice(i, i + per)]); nextDay(d, wk); }
  const head = ['날짜', ...Array.from({ length: per }, (_, i) => `당번 ${i + 1}`)];
  rows.forEach(r => { while (r.length < head.length) r.push(''); });
  tLast = [head, rows]; showTable($('tWrap'), $('tTbl'), head, rows);
});
$('rGo').addEventListener('click', () => {
  let n = need(); if (!n.length) return;
  const roles = $('tRoles').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!roles.length) { toast('역할을 한 줄에 하나씩 적어 주세요.'); return; }
  if ($('rShuffle').checked) n = shuffle(n);
  const rows = n.map((s, i) => [s, roles[i % roles.length]]);
  tLast = [['이름', '역할'], rows]; showTable($('tWrap'), $('tTbl'), tLast[0], rows);
});
$('tCopy').addEventListener('click', () => tLast ? copyText(tsv(...tLast)) : toast('먼저 표를 만들어 주세요.'));

// ── 상담 시간 ──
let mLast = null;
const hm = v => { const m = String(v).trim().match(/^(\d{1,2}):?(\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null; };
$('mGo').addEventListener('click', () => {
  let n = need(); if (!n.length) return;
  const from = hm($('mFrom').value), to = hm($('mTo').value), len = +$('mLen').value || 20, gap = +$('mGap').value || 0;
  if (from === null || to === null || to - from < len) { toast('시작과 끝 시각을 15:30처럼 적어 주세요. 한 명 시간보다 길어야 해요.'); return; }
  if ($('mShuffle').checked) n = shuffle(n);
  const wk = $('mWeek').checked, d = firstDay($('mStart').value, wk), rows = [], t = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  let i = 0, days = 0;
  while (i < n.length) { days++; for (let s = from; s + len <= to && i < n.length; s += len + gap) rows.push([dayLabel(d), `${t(s)}~${t(s + len)}`, n[i++]]); nextDay(d, wk); }
  mLast = [['날짜', '시간', '이름'], rows]; showTable($('mWrap'), $('mTbl'), mLast[0], rows);
  $('mInfo').textContent = `${n.length}명을 ${days}일에 나눠 배정했어요. 하루 ${Math.floor((to - from + gap) / (len + gap))}명씩이에요.`;
});
$('mCopy').addEventListener('click', () => mLast ? copyText(tsv(...mLast)) : toast('먼저 시간을 배정해 주세요.'));

// ── 출력물 ──
$('lGo').addEventListener('click', () => {
  const n = need(); if (!n.length) return;
  $('print').innerHTML = `<div class="labels" style="grid-template-columns:repeat(${+$('lCols').value},1fr)">${n.map(s => `<div class="label" style="height:${+$('lH').value}mm;font-size:${+$('lFont').value}pt">${esc(s)}</div>`).join('')}</div>`;
  window.print();
});
$('cGo').addEventListener('click', () => {
  const rows = parseTable($('roster').value); if (!rows.length) { need(); return; }
  let heads = $('cHeads').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!heads.length) heads = ['', '', '', '', ''];
  const split = rows.every(r => r.length >= 2);
  $('print').innerHTML = `${$('cTitle').value.trim() ? `<p class="ptitle">${esc($('cTitle').value.trim())}</p>` : ''}<table class="ptable"><tr>${split ? '<th style="width:12mm">번호</th>' : ''}<th style="width:32mm">이름</th>${heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr>
    ${rows.map(r => `<tr>${split ? `<td>${esc(r[0])}</td><td>${esc(r.slice(1).join(' '))}</td>` : `<td>${esc(r.join(' '))}</td>`}${heads.map(() => '<td></td>').join('')}</tr>`).join('')}</table>`;
  window.print();
});

// ── 이름 외우기 ──
let fQueue = [], fTotal = 0;
function fNext() {
  if (!fQueue.length) { $('fCard').hidden = true; toast('모두 외웠어요!'); return; }
  $('fCard').hidden = false; $('fImg').src = fQueue[0].url; $('fName').textContent = '';
  $('fProg').textContent = `${fTotal - fQueue.length} / ${fTotal}명 외움`;
}
dropZone($('fDrop'), $('fFile'), files => {
  fQueue.forEach(f => URL.revokeObjectURL(f.url));
  fQueue = shuffle(files.filter(f => f.type.startsWith('image/')).map(f => ({ name: baseName(f.name), url: URL.createObjectURL(f) })));
  fTotal = fQueue.length; if (!fTotal) { toast('사진 파일을 넣어 주세요.'); return; }
  fNext();
});
$('fShow').addEventListener('click', () => { if (fQueue[0]) $('fName').textContent = fQueue[0].name; });
$('fOk').addEventListener('click', () => { fQueue.shift(); fNext(); });
$('fNo').addEventListener('click', () => { if (fQueue.length > 1) fQueue.splice(Math.min(3, fQueue.length - 1), 0, fQueue.shift()); fNext(); });

// ── QR ──
$('qGo').addEventListener('click', () => {
  const text = $('qText').value.trim(); if (!text) { toast('주소나 글을 넣어 주세요.'); return; }
  const box = $('qrBox'), size = +$('qSize').value; box.innerHTML = ''; box.hidden = false;
  try { new QRCode(box, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); $('qSave').disabled = false; }
  catch { box.hidden = true; toast('글이 너무 길어요. 줄여서 다시 해 보세요.'); }
});
$('qSave').addEventListener('click', () => {
  const src = $('qrBox').querySelector('canvas'); if (!src) return;
  // 가장자리에 흰 여백을 둬야 잘 읽힌다.
  const m = 24, c = document.createElement('canvas'); c.width = src.width + m * 2; c.height = src.height + m * 2;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, m, m);
  c.toBlob(b => saveBlob(b, 'QR.png'), 'image/png');
});
</script>
</body>
</html>
