<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명단 도구 · 업무도우미</title>
<meta name="author" content="Kang SeongHo">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../common.css">
<style>
.win { --c: var(--c-class); }
.count { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; }
.count small { font-size: .85rem; font-weight: 500; color: var(--muted); margin-left: 6px; }
.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; }
.msg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.msg p { flex: 1; white-space: pre-wrap; word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 600; }
</style>
<script src="../common.js"></script>
</head>
<body>
<div class="win">
  <header class="w-head">
    <h1>명단 도구</h1>
    <nav class="w-tabs" id="tabs">
      <button data-tab="miss" class="on">미제출자 찾기</button><button data-tab="mask">이름 가리기</button><button data-tab="merge">학생별 문구</button>
    </nav>
    <span class="local">명단은 저장하지 않고, 창을 닫으면 사라져요</span>
  </header>

  <!-- 미제출자 찾기 -->
  <section class="w-body" data-pane="miss">
    <p class="muted">엑셀이나 설문 결과에서 복사해 붙여 넣으세요. 한 줄에 한 명씩이고, 번호와 이름이 같이 있어도 돼요.</p>
    <div class="cols">
      <label class="field"><span>전체 명단</span><textarea id="msAll" spellcheck="false" placeholder="1	김가을&#10;2	박나래&#10;3	이도윤"></textarea></label>
      <label class="field"><span>제출한 사람</span><textarea id="msDone" spellcheck="false" placeholder="박나래&#10;이도윤"></textarea></label>
      <div class="field"><span>아직 안 낸 사람</span>
        <div class="count num" id="msCount"></div>
        <div class="out" id="msOut"></div>
        <div class="row"><button class="btn primary" id="msCopy">미제출자 복사</button></div>
        <div class="note" id="msExtra" hidden></div>
      </div>
    </div>
  </section>

  <!-- 이름 가리기 -->
  <section class="w-body" data-pane="mask" hidden>
    <p class="muted">공문이나 게시용 자료에 넣을 명단의 이름 가운데를 가려요. (홍길동 → 홍*동, 이산 → 이*)</p>
    <div class="row">
      <label>가릴 칸 <select id="mkCol"><option value="0">한글 2~4자로만 된 칸 모두</option><option value="1">1번째 칸</option><option value="2">2번째 칸</option><option value="3">3번째 칸</option><option value="4">4번째 칸</option></select></label>
      <span class="muted small">이름이 아닌 낱말(예: 국어)까지 가려지면 이름이 있는 칸을 골라 주세요.</span>
    </div>
    <div class="cols">
      <label class="field"><span>원래 명단</span><textarea id="mkIn" spellcheck="false" placeholder="1	홍길동	국어&#10;2	이산	수학"></textarea></label>
      <div class="field"><span>가린 명단</span><div class="out" id="mkOut"></div><div class="row"><button class="btn primary" id="mkCopy">복사</button></div></div>
    </div>
  </section>

  <!-- 학생별 문구 -->
  <section class="w-body" data-pane="merge" hidden>
    <p class="muted">첫 줄이 제목인 표를 붙여 넣고, 문장 틀에 <b>{제목}</b>을 넣으면 한 줄마다 문구를 만들어요. 학부모 문자나 개별 안내에 써요.</p>
    <div class="cols">
      <label class="field"><span>표 (엑셀에서 복사, 첫 줄은 제목)</span><textarea id="mgTable" spellcheck="false" placeholder="이름	과목	미제출&#10;김가을	국어	독서 기록장&#10;박나래	과학	실험 보고서"></textarea></label>
      <div class="field"><span>문장 틀</span>
        <textarea id="mgTpl" spellcheck="false" style="min-height:120px" placeholder="{이름} 학생이 {과목} {미제출}을 아직 내지 않았습니다. 금요일까지 낼 수 있게 지도 부탁드립니다."></textarea>
        <div class="chips" id="mgChips"></div>
      </div>
    </div>
    <div class="row"><b id="mgCount"></b><span class="grow"></span><button class="btn primary" id="mgCopyAll">전체 복사</button></div>
    <div class="msgs" id="mgOut"></div>
  </section>
</div>

<script>
'use strict';
tabs($('tabs'));
const key = s => s.replace(/\s/g, '');
const isName = s => /^[가-힣]{2,4}$/.test(s);

// ── 미제출자 찾기 ──
// 전체 명단의 한 줄에서 어느 칸이든 '제출한 사람' 쪽에 있으면 낸 것으로 본다(순번 같은 숫자 칸은 비교하지 않는다).
let msMissing = [];
function runMiss() {
  const all = parseTable($('msAll').value), done = parseTable($('msDone').value);
  const comparable = c => c && !/^\d+$/.test(c);
  const doneSet = new Set(done.flat().map(key).filter(comparable));
  msMissing = all.filter(r => !r.map(key).filter(comparable).some(c => doneSet.has(c)));
  $('msCount').innerHTML = all.length ? `${msMissing.length}명<small>전체 ${all.length}명 중 ${all.length - msMissing.length}명 제출</small>` : '';
  $('msOut').textContent = all.length ? (msMissing.length ? msMissing.map(r => r.join(' ')).join('\n') : '모두 냈어요.') : '';
  // 제출 쪽에는 있는데 전체 명단에 없는 이름(오타, 다른 반 학생 등)
  const allSet = new Set(all.flat().map(key));
  const extra = [...new Set(done.flat().map(key).filter(c => isName(c) && !allSet.has(c)))];
  $('msExtra').hidden = !extra.length || !all.length;
  $('msExtra').innerHTML = `<b>전체 명단에 없는 이름</b> ${esc(extra.join(', '))} · 오타이거나 다른 반 학생일 수 있어요.`;
}
$('msAll').addEventListener('input', runMiss); $('msDone').addEventListener('input', runMiss);
$('msCopy').addEventListener('click', () => msMissing.length ? copyText(msMissing.map(r => r.join('\t')).join('\n')) : toast('복사할 명단이 없어요.'));

// ── 이름 가리기 ──
const mask = n => n.length === 2 ? n[0] + '*' : n[0] + '*'.repeat(n.length - 2) + n[n.length - 1];
function runMask() {
  const col = +$('mkCol').value;
  const rows = $('mkIn').value.replace(/\r/g, '').split('\n').map(l => l.split('\t'));
  $('mkOut').textContent = rows.map(r => r.map((c, i) => { const t = c.trim(); return (col ? i === col - 1 && t.length >= 2 : isName(t)) ? mask(t) : c; }).join('\t')).join('\n');
}
$('mkIn').addEventListener('input', runMask); $('mkCol').addEventListener('change', runMask);
$('mkCopy').addEventListener('click', () => copyText($('mkOut').textContent));

// ── 학생별 문구 ──
let mgMsgs = [];
function runMerge() {
  const rows = parseTable($('mgTable').value), head = rows[0] || [], tpl = $('mgTpl').value;
  $('mgChips').innerHTML = head.map(h => `<button type="button" data-h="${esc(h)}">{${esc(h)}}</button>`).join('');
  mgMsgs = tpl.trim() ? rows.slice(1).map(r => tpl.replace(/\{([^{}]+)\}/g, (m, k) => { const i = head.indexOf(k.trim()); return i < 0 ? m : (r[i] ?? ''); })) : [];
  $('mgCount').textContent = mgMsgs.length ? `${mgMsgs.length}개` : '';
  $('mgOut').innerHTML = mgMsgs.map((m, i) => `<div class="msg"><p>${esc(m)}</p><button class="btn" data-i="${i}">복사</button></div>`).join('');
  const unknown = [...new Set((tpl.match(/\{([^{}]+)\}/g) || []).map(x => x.slice(1, -1).trim()).filter(k => !head.includes(k)))];
  if (unknown.length && head.length) $('mgCount').textContent += ` · 표에 없는 제목: ${unknown.join(', ')}`;
}
$('mgTable').addEventListener('input', runMerge); $('mgTpl').addEventListener('input', runMerge);
$('mgChips').addEventListener('click', e => {
  const b = e.target.closest('[data-h]'); if (!b) return;
  const t = $('mgTpl'), s = t.selectionStart ?? t.value.length;
  t.value = t.value.slice(0, s) + `{${b.dataset.h}}` + t.value.slice(t.selectionEnd ?? s); t.focus(); runMerge();
});
$('mgOut').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) copyText(mgMsgs[+b.dataset.i]); });
$('mgCopyAll').addEventListener('click', () => mgMsgs.length ? copyText(mgMsgs.join('\n\n')) : toast('만든 문구가 없어요.'));
runMiss(); runMask(); runMerge();
</script>
</body>
</html>
