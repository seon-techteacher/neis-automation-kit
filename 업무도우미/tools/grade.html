<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수행평가 계산 · 업무도우미</title>
<meta name="author" content="Kang SeongHo">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../common.css">
<style>
.win { --c: var(--c-grade); }
.areas { display: flex; flex-wrap: wrap; gap: 10px; }
.area { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 170px; }
.area b { font-size: .95rem; }
.area label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .86rem; color: var(--ink-2); }
.area input { width: 5em; text-align: right; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stats div { font-size: .85rem; color: var(--muted); }
.stats b { display: block; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); }
.stats .bad b { color: var(--bad); }
td.num, th.num { text-align: right; }
</style>
<script src="../common.js"></script>
</head>
<body>
<div class="win">
  <header class="w-head">
    <h1>수행평가 계산</h1>
    <span class="local" style="margin-bottom:12px">점수는 저장하지 않고, 창을 닫으면 사라져요</span>
  </header>
  <section class="w-body">
    <p class="muted">엑셀에서 제목 줄까지 복사해 붙여 넣으세요. 번호·이름 칸 뒤에 영역별 점수 칸이 오면 돼요. 영역마다 만점과 반영 비율을 넣으면 환산 점수와 오류를 알려 줘요.</p>
    <label class="field"><span>점수표</span><textarea id="in" spellcheck="false" style="min-height:150px" placeholder="번호	이름	논술	발표	포트폴리오&#10;1	김가을	18	9	27&#10;2	박나래	20	10	30"></textarea></label>
    <div class="areas" id="areas"></div>
    <div class="note info" id="hint" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="row" id="acts" hidden><button class="btn primary" id="copy">결과 표 복사 (엑셀에 붙여 넣기)</button><label class="row"><input type="checkbox" id="round" checked> 환산 점수를 소수 둘째 자리에서 반올림</label></div>
    <div class="tbl-wrap" id="wrap" hidden><table id="tbl"></table></div>
  </section>
</div>

<script>
'use strict';
const ID_HEAD = /^(번호|순번|연번|학번|이름|성명|학년|반|비고)$/;
let conf = {}, last = null; // conf[영역 이름] = {max, weight}

function analyse() {
  const rows = parseTable($('in').value);
  if (rows.length < 2) return null;
  const head = rows[0], body = rows.slice(1);
  // 점수 칸: 제목이 번호·이름류가 아니고, 값의 절반 이상이 숫자인 칸
  const scoreCols = head.map((h, i) => i).filter(i => !ID_HEAD.test(head[i].replace(/\s/g, '')) && body.filter(r => r[i] !== undefined && r[i] !== '' && !isNaN(+r[i])).length >= body.length / 2);
  return { head, body, scoreCols };
}
function render() {
  const a = analyse(); last = a;
  for (const id of ['acts', 'wrap']) $(id).hidden = !a || !a.scoreCols.length;
  $('hint').hidden = true;
  if (!a) { $('areas').innerHTML = $('stats').innerHTML = ''; return; }
  if (!a.scoreCols.length) { $('areas').innerHTML = $('stats').innerHTML = ''; $('hint').hidden = false; $('hint').innerHTML = '<b>점수 칸을 찾지 못했어요.</b> 첫 줄에 제목(번호, 이름, 영역 이름)이 있는지 확인해 주세요.'; return; }
  const { head, body, scoreCols } = a;
  // 영역 설정: 제목에 '(20)'처럼 만점이 있으면 그 값, 없으면 가장 높은 점수를 처음 값으로 둔다.
  for (const c of scoreCols) {
    const name = head[c];
    if (!conf[name]) {
      const m = name.match(/\(?(\d+(?:\.\d+)?)\s*점?\)?\s*$/);
      const top = Math.max(0, ...body.map(r => +r[c]).filter(v => !isNaN(v)));
      conf[name] = { max: m ? +m[1] : top, weight: '', guessed: !m };
    }
  }
  $('areas').innerHTML = scoreCols.map(c => { const n = head[c], f = conf[n]; return `<div class="area"><b>${esc(n)}</b>
    <label>만점 <input data-n="${esc(n)}" data-k="max" inputmode="decimal" value="${esc(f.max)}"></label>
    <label>반영 비율(%) <input data-n="${esc(n)}" data-k="weight" inputmode="decimal" value="${esc(f.weight)}" placeholder="없음"></label></div>`; }).join('');
  if (scoreCols.some(c => conf[head[c]].guessed)) { $('hint').hidden = false; $('hint').innerHTML = '<b>만점을 확인하세요.</b> 제목에 만점이 없어서 가장 높은 점수를 넣어 두었어요. 실제 만점으로 고쳐 주세요.'; }
  compute();
}
function compute() {
  const { head, body, scoreCols } = last;
  const useW = scoreCols.every(c => conf[head[c]].weight !== '' && !isNaN(+conf[head[c]].weight));
  const wSum = useW ? scoreCols.reduce((s, c) => s + +conf[head[c]].weight, 0) : 0;
  const idCols = head.map((h, i) => i).filter(i => !scoreCols.includes(i));
  const noCol = head.findIndex(h => /^(번호|순번|연번|학번)$/.test(h.replace(/\s/g, '')));
  const seen = {}; let errCount = 0;
  const round = v => $('round').checked ? Math.round(v * 10) / 10 : Math.round(v * 1000) / 1000;
  const out = body.map(r => {
    const errs = [], bad = new Set();
    let sum = 0, conv = 0;
    for (const c of scoreCols) {
      const raw = r[c] ?? '', f = conf[head[c]], v = +raw;
      if (raw === '') { errs.push(`${head[c]} 빠짐`); bad.add(c); continue; }
      if (isNaN(v)) { errs.push(`${head[c]} 숫자 아님`); bad.add(c); continue; }
      if (v < 0) { errs.push(`${head[c]} 음수`); bad.add(c); }
      if (+f.max > 0 && v > +f.max) { errs.push(`${head[c]} 만점(${f.max}) 초과`); bad.add(c); }
      sum += v; if (useW && +f.max > 0) conv += v / +f.max * +f.weight;
    }
    if (noCol >= 0 && r[noCol]) { if (seen[r[noCol]]) errs.push('번호 중복'); seen[r[noCol]] = 1; }
    if (errs.length) errCount++;
    return { r, sum, conv: useW ? round(conv) : null, errs, bad };
  });
  const totals = out.filter(o => !o.errs.length).map(o => useW ? o.conv : o.sum);
  const avg = totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : 0;
  const maxSum = scoreCols.reduce((s, c) => s + (+conf[head[c]].max || 0), 0);
  $('stats').innerHTML = `<div>학생<b class="num">${body.length}명</b></div><div>${useW ? '환산 만점' : '만점 합계'}<b class="num">${useW ? wSum : maxSum}</b></div>
    <div>평균<b class="num">${totals.length ? avg.toFixed(1) : '-'}</b></div><div>최고<b class="num">${totals.length ? Math.max(...totals) : '-'}</b></div><div>최저<b class="num">${totals.length ? Math.min(...totals) : '-'}</b></div>
    <div class="${errCount ? 'bad' : ''}">확인할 학생<b class="num">${errCount}명</b></div>`;
  if (useW && wSum !== 100) { $('hint').hidden = false; $('hint').innerHTML = `<b>반영 비율 합이 ${wSum}%예요.</b> 수행평가 전체 반영 비율과 맞는지 확인해 주세요.`; }
  $('tbl').innerHTML = '<tr>' + idCols.map(i => `<th>${esc(head[i])}</th>`).join('') + scoreCols.map(c => `<th class="num">${esc(head[c])}</th>`).join('') + `<th class="num">합계</th>${useW ? '<th class="num">환산</th>' : ''}<th>확인</th></tr>` +
    out.map(o => '<tr>' + idCols.map(i => `<td>${esc(o.r[i] ?? '')}</td>`).join('') + scoreCols.map(c => `<td class="num${o.bad.has(c) ? ' err' : ''}">${esc(o.r[c] ?? '')}</td>`).join('') +
      `<td class="num"><b>${Math.round(o.sum * 1000) / 1000}</b></td>${useW ? `<td class="num"><b>${o.conv}</b></td>` : ''}<td>${o.errs.length ? `<span class="pill bad">${esc(o.errs.join(', '))}</span>` : ''}</td></tr>`).join('');
  last.result = { idCols, useW, out };
}
$('in').addEventListener('input', () => { conf = {}; render(); });
$('areas').addEventListener('input', e => { const t = e.target; if (!t.dataset.n) return; conf[t.dataset.n][t.dataset.k] = t.value.trim(); conf[t.dataset.n].guessed = false; $('hint').hidden = true; compute(); });
$('round').addEventListener('change', () => last && last.scoreCols.length && compute());
$('copy').addEventListener('click', () => {
  const { head, scoreCols, result } = last, { idCols, useW, out } = result;
  const lines = [[...idCols.map(i => head[i]), ...scoreCols.map(c => head[c]), '합계', ...(useW ? ['환산'] : []), '확인'].join('\t')]
    .concat(out.map(o => [...idCols.map(i => o.r[i] ?? ''), ...scoreCols.map(c => o.r[c] ?? ''), Math.round(o.sum * 1000) / 1000, ...(useW ? [o.conv] : []), o.errs.join(', ')].join('\t')));
  copyText(lines.join('\n'));
});
render();
</script>
</body>
</html>
