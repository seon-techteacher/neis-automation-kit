<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 편집 · 업무도우미</title>
<meta name="author" content="Kang SeongHo">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../common.css">
<style>
.win { --c: var(--c-doc); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: .88rem; color: var(--muted); font-weight: 700; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stage { position: relative; align-self: flex-start; max-width: 100%; line-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; cursor: crosshair; }
.stage canvas { max-width: 100%; max-height: 68vh; display: block; }
.sel { position: absolute; border: 2px dashed #fff; outline: 1px solid #000; background: rgba(31, 63, 174, .18); pointer-events: none; }
</style>
<script src="../common.js"></script>
</head>
<body>
<div class="win">
  <header class="w-head">
    <h1>사진 편집</h1>
    <span class="local" style="margin-bottom:12px">사진은 이 PC 안에서만 처리해요</span>
  </header>
  <section class="w-body">
    <div class="drop" id="drop"><b>사진 하나를 넣으세요</b>얼굴이나 이름을 가리고, 필요한 부분만 자르고, 크기를 줄여 저장해요.<input type="file" id="file" accept="image/*" hidden></div>
    <div id="editor" hidden style="display:flex;flex-direction:column;gap:14px">
      <div class="bar">
        <div class="seg" id="tool"><button data-t="mosaic" class="on">모자이크로 가리기</button><button data-t="box">검게 가리기</button><button data-t="crop">자르기</button></div>
        <button class="btn" id="undo" disabled>되돌리기</button>
        <span class="muted small" id="hint">사진 위를 끌어서 가릴 곳을 정하세요.</span>
      </div>
      <div class="stage" id="stage"><canvas id="cv"></canvas><div class="sel" id="sel" hidden></div></div>
      <div class="bar">
        <label>크기 <select id="max"><option value="0">원래 크기</option><option value="2560">긴 변 2560px</option><option value="1920" selected>긴 변 1920px</option><option value="1280">긴 변 1280px</option><option value="800">긴 변 800px</option></select></label>
        <label>형식 <select id="fmt"><option value="jpg">JPG (용량 작음)</option><option value="png">PNG (선명함)</option></select></label>
        <button class="btn primary big" id="save">저장</button>
        <button class="btn big" id="other">다른 사진</button>
        <span class="muted num" id="info"></span>
      </div>
    </div>
  </section>
</div>

<script>
'use strict';
const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
let tool = 'mosaic', undoStack = [], name = '사진', drag = null;
const HINT = { mosaic: '사진 위를 끌어서 가릴 곳을 정하세요.', box: '사진 위를 끌어서 가릴 곳을 정하세요.', crop: '사진 위를 끌어서 남길 부분을 정하세요.' };

dropZone($('drop'), $('file'), async files => {
  try {
    const bmp = await createImageBitmap(files[0]);
    cv.width = bmp.width; cv.height = bmp.height; ctx.drawImage(bmp, 0, 0);
    name = baseName(files[0].name); undoStack = []; $('undo').disabled = true;
    $('drop').hidden = true; $('editor').hidden = false; showInfo();
  } catch { toast('읽을 수 없는 사진이에요.'); }
});
$('other').addEventListener('click', () => { $('editor').hidden = true; $('drop').hidden = false; });
$('tool').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tool = b.dataset.t; $('tool').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('hint').textContent = HINT[tool]; });
const showInfo = () => { $('info').textContent = `${cv.width} × ${cv.height}px`; };

function snapshot() {
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; c.getContext('2d').drawImage(cv, 0, 0);
  undoStack.push(c); if (undoStack.length > 8) undoStack.shift(); $('undo').disabled = false;
}
$('undo').addEventListener('click', () => {
  const c = undoStack.pop(); if (!c) return;
  cv.width = c.width; cv.height = c.height; ctx.drawImage(c, 0, 0); $('undo').disabled = !undoStack.length; showInfo();
});

// 화면 좌표 → 사진 좌표
const pos = e => { const r = cv.getBoundingClientRect(); return { x: Math.min(Math.max(0, e.clientX - r.left), r.width), y: Math.min(Math.max(0, e.clientY - r.top), r.height), k: cv.width / r.width }; };
$('stage').addEventListener('pointerdown', e => { const p = pos(e); drag = { x0: p.x, y0: p.y }; $('stage').setPointerCapture(e.pointerId); });
$('stage').addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pos(e), s = $('sel');
  s.hidden = false; s.style.left = Math.min(drag.x0, p.x) + 'px'; s.style.top = Math.min(drag.y0, p.y) + 'px';
  s.style.width = Math.abs(p.x - drag.x0) + 'px'; s.style.height = Math.abs(p.y - drag.y0) + 'px';
});
$('stage').addEventListener('pointerup', e => {
  if (!drag) return;
  const p = pos(e), k = p.k; $('sel').hidden = true;
  const x = Math.round(Math.min(drag.x0, p.x) * k), y = Math.round(Math.min(drag.y0, p.y) * k);
  const w = Math.round(Math.abs(p.x - drag.x0) * k), h = Math.round(Math.abs(p.y - drag.y0) * k);
  drag = null;
  if (w < 4 || h < 4) return;
  snapshot();
  if (tool === 'box') { ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h); }
  else if (tool === 'mosaic') {
    // 영역을 아주 작게 줄였다가 다시 키워서 알아볼 수 없게 한다.
    const n = Math.max(3, Math.min(8, Math.round(Math.min(w, h) / 12))), t = document.createElement('canvas');
    t.width = Math.max(1, Math.round(w / Math.max(w, h) * n)); t.height = Math.max(1, Math.round(h / Math.max(w, h) * n));
    t.getContext('2d').drawImage(cv, x, y, w, h, 0, 0, t.width, t.height);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(t, 0, 0, t.width, t.height, x, y, w, h); ctx.imageSmoothingEnabled = true;
  } else {
    const data = ctx.getImageData(x, y, w, h); cv.width = w; cv.height = h; ctx.putImageData(data, 0, 0); showInfo();
  }
});
$('stage').addEventListener('pointercancel', () => { drag = null; $('sel').hidden = true; });

$('save').addEventListener('click', () => {
  const max = +$('max').value, k = max ? Math.min(1, max / Math.max(cv.width, cv.height)) : 1, png = $('fmt').value === 'png';
  const out = document.createElement('canvas'); out.width = Math.round(cv.width * k); out.height = Math.round(cv.height * k);
  const x = out.getContext('2d'); if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height); }
  x.drawImage(cv, 0, 0, out.width, out.height);
  out.toBlob(b => { saveBlob(b, `${name}_편집.${png ? 'png' : 'jpg'}`); $('info').textContent = `${out.width} × ${out.height}px · ${fmtMB(b.size)}로 저장했어요`; }, png ? 'image/png' : 'image/jpeg', 0.85);
});
</script>
</body>
</html>
